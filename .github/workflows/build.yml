
name: build

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -dynamiclib -fobjc-arc -framework Foundation -framework UIKit \
            -install_name @rpath/AdProbe.dylib -o AdProbe.dylib AdProbe.m
          codesign -f -s - AdProbe.dylib
          file AdProbe.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: AdProbe
          path: AdProbe.dylib
